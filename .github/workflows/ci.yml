name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Tests and pack checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # No `draft` extra: the tests use a fake AI and a fake Stanza. The `api` extra runs the API tests.
      - name: Unit tests
        run: uv run --locked --extra api python -m unittest discover -s tests -t .
      - name: Pack checks
        run: uv run --locked pipeline check
