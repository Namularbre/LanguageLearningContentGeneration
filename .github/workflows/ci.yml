name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Tests and pack checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Pack checks
        run: python -m pipeline check
