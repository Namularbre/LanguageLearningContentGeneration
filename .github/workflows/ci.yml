name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Tests and pack checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Installs the project only (no `draft` extra): the tests use a fake AI and a fake Stanza.
      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests -t .
      - name: Pack checks
        run: uv run --locked pipeline check
